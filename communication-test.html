<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>問い合わせ送信テスト</title><style>body{max-width:640px;margin:32px auto;padding:0 16px;font-family:sans-serif;color:#333}label{display:block;margin:16px 0 6px;font-weight:600}select,textarea,button{box-sizing:border-box;width:100%;padding:10px;font:inherit}textarea{min-height:140px}button{margin-top:16px;color:white;background:#398b61;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.6}#result{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:#f2f7f3;border-radius:6px}</style></head><body>
<h1>問い合わせ送信テスト</h1><p>テスト用の内容だけを送信してください。画像添付はこのテストでは扱いません。</p><form id="testForm">
<label for="category">お問い合わせ種別</label><select id="category"><option>不具合報告</option><option>改善要望</option><option>質問</option><option selected>その他</option></select>
<label for="tool">対象ツール</label><select id="tool"><option>ダイス集計ツール</option><option>オリウマ・シナリオ管理ツール</option><option selected>その他</option></select>
<label for="detail">テスト内容</label><textarea id="detail" maxlength="5000" required placeholder="例：通信確認用のテスト送信です。"></textarea><label><input id="replyWanted" type="checkbox"> 返信を希望する</label><button id="sendButton" type="submit">テストを送信</button></form><h2>結果</h2><div id="result" role="status">未送信</div>
<script>
const API="https://script.google.com/macros/s/AKfycby26-bHnmO5NedXqJlOuphquZ2rK-vELE0VYeHRdSFmG6vcsmPqgSZi2yYquKreHwft5A/exec";
const form=document.getElementById("testForm"),button=document.getElementById("sendButton"),box=document.getElementById("result");
form.addEventListener("submit",async e=>{e.preventDefault();const message=document.getElementById("detail").value.trim();if(!message)return;const payload={action:"createInquiry",category:document.getElementById("category").value,tool:document.getElementById("tool").value,detail:message,replyWanted:document.getElementById("replyWanted").checked,hasAttachments:false};const start=performance.now();button.disabled=true;box.textContent="送信中…";try{const response=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});const raw=await response.text();let data;try{data=JSON.parse(raw)}catch{throw Error("GASからJSON応答がありませんでした")};if(!response.ok||!data.ok)throw Error("受付失敗: "+(data.error||response.status));box.textContent=JSON.stringify({elapsedMs:Math.round(performance.now()-start)+" ms",httpStatus:response.status,receiptNumber:data.receiptNumber,password:data.password,note:"テスト用の番号とパスワードです。テスト後は記録を削除してください。"},null,2)}catch(err){box.textContent=JSON.stringify({elapsedMs:Math.round(performance.now()-start)+" ms",error:err.message,note:"GASの実行履歴も確認してください。"},null,2)}finally{button.disabled=false}});
</script></body></html>
